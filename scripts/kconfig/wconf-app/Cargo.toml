# SPDX-License-Identifier: GPL-2.0-only OR MIT
# For Tauri-based wconfig

[package]
name = "wconf"
version = "0.1.0"
description = "A Tauri-based kernel configuration tool"
authors = ["The Wconf Developers"]
license = "GPL-2.0-only"
repository = "https://kernel.org/"
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.8.3", features = ["shell-open"] }
nom-kconfig = { path = "src/nom_kconfig_vendored" }

[dev-dependencies]
tempfile = "3.10.1"

[features]
# by default Tauri builds all frontends though available features
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
