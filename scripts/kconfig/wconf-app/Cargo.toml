[package]
name = "wconf"
version = "0.1.0"
description = "Tauri-based kernel configuration tool"
authors = ["Kernel Development Team"]
license = "GPL-2.0"
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "wconf_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["shell-open"] }
libc = "0.2"
nom = "7.1"
regex = "1.0"

[dev-dependencies]
tempfile = "3.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
